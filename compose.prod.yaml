# Delta-server overrides. Use together with compose.yaml:
#   docker compose -f compose.yaml -f compose.prod.yaml --profile full up -d --build
# delta-server already uses port 3000, so set WEB_PORT (for example 3010) in .env there. API_PORT defaults to 8000.
# The tunnel points at the api container (port 8000) and, if the web app is served too, at web (port 3000).

services:
  db:
    restart: unless-stopped
  api:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${API_PORT:-8000}:8000"
  worker:
    restart: unless-stopped
  web:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
