openapi: 3.1.0
info:
  title: Pomysłownik! API
  version: 1.1.0-draft.5
  summary: API for Pomysłownik!, an innovation radar prototype (Hacknation 2026, PCI challenge).
  description: |
    Contract-first draft. The frontend builds against this file with a mock server.
    The backend implements it. If either side needs a change, change this file first.

    **Product rules that shape the API**
    - The Radar finds innovations that already exist. There is no endpoint to submit an idea.
    - **Everyone signs in** and picks a role (one of the six audiences). This deters misuse of the
      intellectual property described on the cards. Only `/health`, `/api/v1/audiences` and the `/api/v1/auth/*`
      sign-in calls work without a session (`/auth/logout` needs one). Every other endpoint needs
      `Authorization: Bearer <session token>`.
    - Sign-in uses an identity provider. For the demo the provider is a clearly labelled **sandbox**. The real
      national login (login.gov.pl, the Węzeł Krajowy) is a drop-in provider with a redirect flow
      (`/auth/{provider}/start`, `/auth/exchange`). It carries Profil Zaufany (SMS code), the mObywatel app,
      e-dowód and bank login, so the frontend never handles phone numbers or national ID numbers.
      Design and research: `docs/api/AUTH-PROVIDERS.md`.
    - The `/admin` endpoints need the separate admin token.
    - Every assessed field says whether it is a **confirmed** fact (with sources) or an **estimate**
      (with the method). The model never produces a number. Scores come from stored evidence.
    - Usage statistics stay aggregated. Events carry no free text. The server attaches the user's role,
      not the user id, to each event.

    **Conventions**
    - Base path `/api/v1`. Changes inside v1 only add optional fields or endpoints.
    - JSON, `camelCase`, UTF-8. Timestamps are RFC 3339 in UTC.
    - Every success body is `{ "data": ... }`. List bodies add `meta` with `total`, `limit`, `offset`.
    - Every error body is `{ "error": { "code", "message", "details", "requestId" } }`.
    - Malformed JSON returns `400 bad_request`. A well-formed but invalid value returns `422 validation_failed`.
    - **The server picks the language** (since draft 3). Supported: `pl` (default), `en`, `uk`.
      1. **Named language.** The request names it with the `lang` query parameter or the `Accept-Language` header
         (`lang` wins). Then every `LocalizedText` is **one string** in that language, and error `message` values
         follow it. The frontend only renders.
      2. **No language named** (deprecated, removed in v2). Every `LocalizedText` is the object form with `pl`, `en`
         and `uk`. Only error `message` and `Content-Language` use the fallback: the signed-in user's
         `preferredLanguage`, then `pl`.
      Every JSON response sets `Content-Language` (the language of the strings and messages) and
      `Vary: Accept-Language`. New clients always send `Accept-Language`. Error `code` values never change.
    - Every stored text exists in all supported languages. A Ukrainian text made by machine translation is listed in
      the card's `machineTranslated` field, and the UI says so. Two kinds of text are **not** translated and stay in
      their own language with a language field: source quotes (`passageLang`) and titles of external works
      (`RelatedWork.titleLang`).
    - **Plain text only** (planned, G4). Every string is plain text, never HTML or Markdown. The backend strips markup at ingest. The
      frontend renders strings as text, never as HTML.
    - **Links** (planned, G3). Every URL a person can follow uses `http` or `https` (`WebUrl`). Collected links with any other scheme
      (`javascript:`, `data:`) are dropped at ingest.
    - **Caching.** Responses that need a session send `Cache-Control: private, no-store`. Public reference data
      (`/audiences`, `/auth/providers`) may be cached briefly. All responses vary by `Accept-Language`.
    - CORS: the API allows the web origins listed in the `CORS_ORIGINS` environment variable.
    - Rate limiting: a `429` carries a `Retry-After` header (seconds). This includes the admin endpoints (planned, G5).

    **Known gaps (draft 4).** Rules marked `(planned, Gn)` are agreed but **not enforced by the live API yet**. They
    are written here so nobody builds against the gap. Details and the light fix for each: `docs/api/CONTRACT-REVIEW.md` §0b.
    G1 sandbox subjects are not secret (partly closed). G2 is closed (headers live since draft 5). G3 link schemes. G4 plain text at ingest.
    G5 admin rate limit. G6 usage-stats periods. G7 input limits. G8 rate-limit address on the LAN. G9 unverified email.
    The redirect sign-in flow (`/auth/{provider}/*`, `/auth/exchange`) is design only (tasks B13, B14).

    **Status of this draft**
    Mock example data is fictional and starts with `[MOCK]`. Field names are agreed by the team only when
    this file is merged. Open questions are in `docs/api/CONTRACT-REVIEW.md`.
  license:
    name: EUPL-1.2
    url: https://eupl.eu/1.2/en
servers:
  - url: http://localhost:4010
    description: Mock server (Prism), for frontend work
  - url: http://localhost:8000
    description: Local backend
  - url: https://demo.delta43.net
    description: Live demo API on delta-server, behind the Cloudflare tunnel
# Signed in by default. Public operations say `security: []`. Admin operations use the admin token.
security:
  - userBearer: []
tags:
  - name: Auth
    description: Sign in, register with a role, sign out, read and edit your profile.
  - name: Cards
    description: Search, read and compare innovation cards. Signed-in users.
  - name: Reference
    description: Filter options, audience presets (public, used by the registration form), sources.
  - name: Statistics
    description: Aggregate numbers for the overview and for PCI. Signed-in users.
  - name: Events
    description: Usage events. Signed-in users. No free text.
  - name: Admin
    description: Trigger and inspect collection runs. Needs a bearer token.
  - name: System
    description: Health.

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      summary: Liveness and dependency check
      description: Not versioned. Used by container healthchecks and the tunnel monitor.
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, version, database]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  version: { type: string, examples: ['1.1.0-draft.4'] }
                  database: { type: string, enum: [up, down] }
                  lastRefreshAt:
                    type: [string, 'null']
                    format: date-time
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/v1/auth/providers:
    get:
      tags: [Auth]
      operationId: listAuthProviders
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
      summary: Identity providers the user can sign in with
      security: []
      responses:
        '200':
          description: Providers. In the demo only `sandbox_id` is enabled.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuthProvider' }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
      summary: Create an account with a verified identity and a role
      description: |
        The identity comes from the provider: `providerSubject` for the sandbox, or a `registrationTicket` from
        `/auth/exchange` for a real provider. The user picks one role, states an affiliation and interests, and must
        accept the terms of use, which forbid misuse of the intellectual property on the cards.
        Returns a session, so the user is signed in at once.

        **Sandbox rule** (planned, G1). A sandbox subject is not a secret, so anyone who knows it can sign in as it. In production
        (`SANDBOX_FREE_SUBJECTS=false`, the default) the sandbox accepts only the shared demo identities listed in
        `/auth/providers` (`demoIdentities`). Any other subject returns `422 validation_failed`. Free subjects are for
        local development only. Never enter real personal data with a sandbox identity.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and signed in.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: An account already exists for this identity (`account_exists`). Sign in instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
      summary: Sign in with a sandbox identity
      description: Sandbox only (`flow` `direct`). Real providers use `/auth/{provider}/start`. The sandbox rule under `register` applies.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: No account for this identity (`registration_required`). Go to registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/{provider}/start:
    post:
      tags: [Auth]
      operationId: startProviderSignIn
      summary: Start a redirect sign-in with a real identity provider
      description: |
        For providers with `flow: redirect` (login.gov.pl, later mojeID). The backend builds the signed request and keeps
        the state. The web server sends the browser to `redirectUrl`. Identity data never passes through the frontend.

        **`returnTo` check.** The backend parses the URL. Its scheme, host and port must equal one origin in
        `CORS_ORIGINS` exactly (no prefix match, so `https://pomyslownik.delta43.net.evil.example` fails). No user
        information part. Otherwise `422 validation_failed`.

        **Binding (PKCE, RFC 7636).** The web server makes a random `codeVerifier` (43 to 128 characters), keeps it in
        an httpOnly cookie on the web origin, and sends `codeChallenge` = BASE64URL(SHA-256(verifier)). `/auth/exchange`
        needs the verifier. So a code that leaks (logs, browser history, referrer) is useless to anyone else, and an
        attacker cannot sign a victim in to the attacker's account (login CSRF). The `returnTo` page sends
        `Referrer-Policy: no-referrer`.
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent, returnTo, codeChallenge, codeChallengeMethod]
              additionalProperties: false
              properties:
                intent: { type: string, enum: [login, register] }
                returnTo:
                  allOf: [{ $ref: '#/components/schemas/WebUrl' }]
                  description: 'Web page that receives `?code=` (or `?error=`) after the provider. Exact origin match, see above.'
                codeChallenge: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', description: 'BASE64URL(SHA-256(codeVerifier)), no padding.' }
                codeChallengeMethod: { type: string, const: S256 }
      responses:
        '200':
          description: Go to the provider.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [redirectUrl, expiresAt]
                    properties:
                      redirectUrl:
                        allOf: [{ $ref: '#/components/schemas/WebUrl' }]
                        description: 'A backend page that forwards the browser to the provider (auto-posted SAML request or OIDC redirect).'
                      expiresAt: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/auth/{provider}/redirect:
    get:
      tags: [Auth]
      operationId: providerRedirect
      summary: Browser hand-off page to the provider
      description: Returns a small HTML page that auto-posts `SAMLRequest` and `RelayState` to login.gov.pl, or a `303` to an OIDC provider. Opened by the browser only.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - { name: state, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: Auto-posting form (no script needed, a visible button is the fallback).
          content:
            text/html:
              schema: { type: string }
        '303': { description: Redirect to an OIDC provider. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/{provider}/acs:
    post:
      tags: [Auth]
      operationId: providerAssertionConsumer
      summary: SAML assertion consumer service (called by login.gov.pl through the browser)
      description: |
        Receives `SAMLart` (HTTP-Artifact binding). The backend resolves it with a signed `ArtifactResolve` over SOAP,
        decrypts the assertion, checks the level of assurance, and turns `PersonIdentifier` into a pairwise subject.
        The PESEL is never stored. Then it sends the browser to `returnTo` with a one-time `code`, or with `error`.

        Checks, all required: the signature on the response and the assertion; `InResponseTo` equals the stored request
        id; `Audience` is our issuer; `NotBefore` / `NotOnOrAfter` with at most 60 s clock skew; `RelayState` matches a
        stored, unused state. Each artifact, assertion id and state is accepted once (replay guard). Any failure gives
        `error=auth_failed` and is logged without personal data.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLart]
              properties:
                SAMLart: { type: string }
                RelayState: { type: string }
      responses:
        '303': { description: 'Back to the web app: `returnTo?code=...` or `returnTo?error=auth_cancelled|auth_failed|assurance_too_low`.' }
        '200':
          description: Only when the sign-in state is lost (for example an expired `RelayState`). A plain page in the negotiated language with a link to start again.
          content:
            text/html:
              schema: { type: string }

  /api/v1/auth/{provider}/callback:
    get:
      tags: [Auth]
      operationId: providerCallback
      summary: OpenID Connect callback (later providers such as mojeID through a broker)
      description: Authorisation code flow with PKCE and `nonce` towards the provider. The ID token signature, `iss`, `aud`, `exp` and `nonce` are checked. `state` is accepted once.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '303': { description: 'Back to the web app, as for `acs`.' }
        '200':
          description: Only when the sign-in state is lost. Same page as for `acs`.
          content:
            text/html:
              schema: { type: string }

  /api/v1/auth/exchange:
    post:
      tags: [Auth]
      operationId: exchangeSignInCode
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
      summary: Swap the one-time code for a session, or for a registration ticket
      description: |
        Called by the web server, which then sets the httpOnly session cookie. The code is valid for 60 seconds and works
        once. The `codeVerifier` must match the `codeChallenge` sent to `/start`. A wrong verifier burns the code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, codeVerifier]
              additionalProperties: false
              properties:
                code: { type: string, minLength: 32, maxLength: 200 }
                codeVerifier: { type: string, minLength: 43, maxLength: 128, pattern: '^[A-Za-z0-9._~-]{43,128}$' }
      responses:
        '200':
          description: Known identity, signed in.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Session' }
        '202':
          description: New identity. Show the registration form with this ticket (valid 15 minutes, single use, kept on the web server, never in the page or the URL).
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RegistrationTicket' }
        '400':
          description: Unknown, used or expired code, or a verifier that does not match (`state_invalid`). The same answer for every case, so it reveals nothing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
      summary: End the current session
      description: The frontend handles both answers. `204` ends here. `200` also needs the browser to visit `redirectUrl` for single logout (SLO) at the provider.
      responses:
        '204':
          description: Signed out. Safe to repeat.
        '200':
          description: Signed out here. The provider also needs single logout (SLO), so send the browser to `redirectUrl` (a backend page, never an outside link).
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [redirectUrl]
                    properties:
                      redirectUrl: { $ref: '#/components/schemas/WebUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me:
    get:
      tags: [Auth]
      operationId: getMe
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
      summary: The signed-in user's profile
      responses:
        '200':
          description: Profile.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Auth]
      operationId: deleteMe
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
      summary: Delete the account and its personal data (GDPR right to erasure)
      description: Removes email, affiliation and interests, and ends all sessions. Aggregated usage counts stay, because they hold no user id. A shared demo identity cannot be deleted or changed (`403 forbidden`), so one visitor cannot break it for the others (planned, G1).
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Auth]
      operationId: updateMe
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
      summary: Change role, affiliation, interests or language
      description: A shared demo identity cannot be changed (`403 forbidden`, planned, G1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: Updated profile.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/cards:
    get:
      tags: [Cards]
      operationId: searchCards
      summary: Search and filter innovation cards
      description: |
        Free-text search plus filters. Multi-value filters are comma separated (`area=technological,educational`).
        Counts and facets for the same filters come from `/api/v1/facets`.
        Default sort is `relevance` when `q` is set, otherwise `recent`.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
        - { name: q, in: query, description: 'Free text. Matches the Polish, English and Ukrainian text of a card, with and without Polish diacritics. Which language matched does not change the response language.', schema: { type: string, maxLength: 200 } }
        - { name: area, in: query, style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/Area' } } }
        - { name: implementationLevel, in: query, style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/ImplementationLevel' } } }
        - { name: trlMin, in: query, description: 'At most `trlMax`, otherwise `422` (planned, G7).', schema: { type: integer, minimum: 1, maximum: 9 } }
        - { name: trlMax, in: query, schema: { type: integer, minimum: 1, maximum: 9 } }
        - { name: tag, in: query, style: form, explode: false, description: Tag slugs., schema: { $ref: '#/components/schemas/TagSlugList' } }
        - { name: region, in: query, description: 'Region code (ISO 3166-2:PL without `PL-`), for example `PK` for Podkarpackie.', schema: { $ref: '#/components/schemas/RegionCode' } }
        - { name: audience, in: query, description: Applies the preset from `/api/v1/audiences`. Explicit filters override it., schema: { $ref: '#/components/schemas/AudienceId' } }
        - { name: polishIp, in: query, description: Only cards based on Polish IP., schema: { type: boolean } }
        - { name: minCredibility, in: query, schema: { type: integer, minimum: 0, maximum: 100 } }
        - { name: includeStale, in: query, schema: { type: boolean, default: true } }
        - { name: polishIpStatus, in: query, style: form, explode: false, description: 'Comma separated, for example `confirmed,stated`.', schema: { type: array, items: { type: string, enum: [confirmed, stated, unknown] } } }
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, recent, innovativeness, applicationPotential, credibility]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: A page of card summaries.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CardSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/cards/{cardId}:
    get:
      tags: [Cards]
      operationId: getCard
      summary: Read one full innovation card
      description: Includes the assessment, the sources and the evidence rows the scores were computed from.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CardId'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: The card.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Card' }
              examples:
                default:
                  summary: Full card (fictional)
                  value:
                    data:
                      $ref: '#/components/examples/CardDetail/value'
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/cards/{cardId}/similar:
    get:
      tags: [Cards]
      operationId: getSimilarCards
      summary: Cards similar to this one
      description: |
        Used for the innovativeness check and the "similar solutions" panel. Sorted by similarity, highest first.
        Since draft 3 the same hits, plus the external research hits (papers, patents, research projects, listings), are
        also stored on the card in `relatedWork`, so one card shows who else works on the same thing.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CardId'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Similar cards.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [card, similarity, basis]
                      properties:
                        card: { $ref: '#/components/schemas/CardSummary' }
                        similarity:
                          type: number
                          minimum: 0
                          maximum: 1
                          description: Computed by code from trigram text similarity and shared tags (embeddings later, task B10). Not written by the model.
                        basis: { $ref: '#/components/schemas/Basis' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/cards/{cardId}/history:
    get:
      tags: [Cards]
      operationId: getCardHistory
      summary: Status changes found by scheduled refreshes
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CardId'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Changes, newest first. Empty when nothing changed since first seen.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/StatusChange' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/compare:
    get:
      tags: [Cards]
      operationId: compareCards
      summary: Compare two to four cards side by side
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          description: Two to four different card ids, comma separated. A repeated id returns `422` (planned, G7).
          schema:
            type: array
            minItems: 2
            maxItems: 4
            items: { type: string, format: uuid }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: The cards and a row-by-row comparison the frontend can render as a table.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [cards, rows]
                    properties:
                      cards:
                        type: array
                        items: { $ref: '#/components/schemas/CardSummary' }
                      rows:
                        type: array
                        items: { $ref: '#/components/schemas/CompareRow' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/facets:
    get:
      tags: [Reference]
      operationId: getFacets
      summary: Filter options with counts for the current filters
      description: |
        Accepts the same filter parameters as `/api/v1/cards` (not `sort`, `limit`, `offset`), so the counts match the list.
        The `tag` and `region` lists return at most the 50 largest options. **Every selected value is always returned**,
        with its label, even when its count is 0, so the frontend never has to invent a label (task B18).
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: area, in: query, style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/Area' } } }
        - { name: implementationLevel, in: query, style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/ImplementationLevel' } } }
        - { name: tag, in: query, style: form, explode: false, schema: { $ref: '#/components/schemas/TagSlugList' } }
        - { name: region, in: query, schema: { $ref: '#/components/schemas/RegionCode' } }
        - { name: audience, in: query, schema: { $ref: '#/components/schemas/AudienceId' } }
        - { name: polishIp, in: query, schema: { type: boolean } }
        - { name: trlMin, in: query, schema: { type: integer, minimum: 1, maximum: 9 } }
        - { name: trlMax, in: query, schema: { type: integer, minimum: 1, maximum: 9 } }
        - { name: minCredibility, in: query, schema: { type: integer, minimum: 0, maximum: 100 } }
        - { name: includeStale, in: query, schema: { type: boolean, default: true } }
        - { name: polishIpStatus, in: query, style: form, explode: false, schema: { type: array, items: { type: string, enum: [confirmed, stated, unknown] } } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Counts per option.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [area, implementationLevel, tag, region, polishIp]
                    properties:
                      area: { type: array, items: { $ref: '#/components/schemas/FacetOption' } }
                      implementationLevel: { type: array, items: { $ref: '#/components/schemas/FacetOption' } }
                      tag: { type: array, items: { $ref: '#/components/schemas/FacetOption' } }
                      region: { type: array, items: { $ref: '#/components/schemas/FacetOption' } }
                      polishIpStatus: { type: array, items: { $ref: '#/components/schemas/FacetOption' } }
                      polishIp:
                        type: object
                        required: ['true', 'false']
                        properties:
                          'true': { type: integer, minimum: 0 }
                          'false': { type: integer, minimum: 0 }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/audiences:
    get:
      tags: [Reference]
      operationId: listAudiences
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
      security: []
      summary: The six audience presets
      description: A preset is a saved filter set plus the fields to show first. It is not a separate site and not an account type.
      responses:
        '200':
          description: All presets.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Audience' }

  /api/v1/tags:
    get:
      tags: [Reference]
      operationId: listTags
      summary: Tags with their card counts, newest first by default
      description: '`sort=recent` puts the tags of the most recently found cards first, for the chips under the search bar. `sort=count` puts the most used first.'
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
        - { name: sort, in: query, schema: { type: string, enum: [recent, count], default: recent } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 12 } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Tags.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [slug, label, count, lastSeenAt]
                      properties:
                        slug: { type: string }
                        label: { $ref: '#/components/schemas/LocalizedText' }
                        count: { type: integer, minimum: 1 }
                        lastSeenAt: { type: string, format: date-time, description: When the newest card with this tag was first found. }

  /api/v1/sources:
    get:
      tags: [Reference]
      operationId: listSources
      summary: Sources the Radar collects from, with freshness
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
        - { name: type, in: query, schema: { $ref: '#/components/schemas/SourceType' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: A page of sources.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SourceSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  /api/v1/stats/overview:
    get:
      tags: [Statistics]
      operationId: getOverviewStats
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
      summary: Database size, coverage and freshness
      description: Feeds the home page and the effectiveness measures (task section 6e).
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Current numbers. Computed from the database, never from the model.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/OverviewStats' }

  /api/v1/stats/usage:
    get:
      tags: [Statistics]
      operationId: getUsageStats
      summary: Anonymous usage trends for PCI
      description: |
        Aggregates of events from `POST /api/v1/events`, by role, area and tag. Counts below 5 are not shown in any
        list (including `mostViewedCards` and `searchesByAudience`), to avoid singling anyone out.
        To stop anyone from working out a hidden count by comparing overlapping periods, a period is at least 7 days
        (planned, G6). `from` after `to`, a shorter period, or a period over 366 days returns `422`.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
        - { name: from, in: query, description: Start of period., schema: { type: string, format: date } }
        - { name: to, in: query, description: End of period (inclusive)., schema: { type: string, format: date } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Aggregated counts.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/UsageStats' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/events:
    post:
      tags: [Events]
      operationId: recordEvent
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
      summary: Record one anonymous usage event
      description: |
        Safe to retry. The same `eventId` is stored once. No free text and no IP address is stored.
        The server adds the user's role from the session. The user id is not stored with the event.
        The browser never holds the session token, so it cannot call this endpoint directly (and `navigator.sendBeacon`
        cannot send an `Authorization` header). The web server sends the event (server action or route handler),
        fire-and-forget, and ignores failures.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsageEvent' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '202':
          description: Accepted. A repeated `eventId` also returns 202.
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/admin/collect-runs:
    post:
      tags: [Admin]
      operationId: startCollectRun
      summary: Start a collection or refresh run
      description: |
        Starts the collectors now, outside the schedule. Used in the demo to show a status change.
        Send an `Idempotency-Key` header. A retry with the same key and body returns the same run.
        The same key with a different body returns `409`.
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 80 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [collect, refresh]
                  description: '`collect` looks for new items. `refresh` rechecks known cards for status changes.'
                sourceIds:
                  type: array
                  description: Limit the run to these sources. Empty or missing means all.
                  items: { type: string, format: uuid }
      responses:
        '202':
          description: Run accepted.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CollectRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [Admin]
      operationId: listCollectRuns
      summary: List recent runs
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of runs, newest first.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CollectRun' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/collect-runs/{runId}:
    get:
      tags: [Admin]
      operationId: getCollectRun
      summary: Read one run
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The run.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CollectRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/source-config:
    get:
      tags: [Admin]
      operationId: getSourceConfig
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
      summary: Which configured sources can run, and why not
      description: |
        Reads `data/sources/registry.json` and the environment. Shows for each source whether it is enabled, whether the
        token it names is set, and the robots.txt verdict. **Never returns a token value**, only `tokenPresent`.
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: The registry with readiness per source.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SourceConfigStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      description: Session token from `/api/v1/auth/login` or `/api/v1/auth/register`. Opaque string. Expires (see `Session.expiresAt`).
    adminBearer:
      type: http
      scheme: bearer
      description: Static admin token from the `ADMIN_TOKEN` environment variable. Only for the demo and PCI staff. Never put it in frontend code that is served to the public.

  examples:
    CardDetail:
      summary: Full card (fictional)
      value:
          id: 7b1d5a52-3d0e-4c52-9a43-0a8e5f1c2d01
          title: '[MOCK] Lightweight sensor housing'
          summaryShort: '[MOCK] A composite housing for flight sensors, tested in a university lab.'
          summary: '[MOCK] A composite housing that cuts sensor mass for small aircraft. Prototype tested in a university lab. Patent application filed in Poland. Fictional example for frontend work.'
          area: technological
          tags: [{ slug: robotics, label: Robotics }, { slug: aviation, label: Aviation }]
          organisation: { name: '[MOCK] Example University of Technology', type: university, url: null, region: PK }
          implementationLevel: { value: prototype, basis: confirmed }
          trl: { applicable: true, value: 5, basis: estimate }
          scores: { innovativeness: 62, applicationPotential: 48, credibility: 71 }
          polishIp: true
          lastCheckedAt: '2026-11-22T06:10:00Z'
          stale: false
          sourceCount: 2
          relevance: null
          implementationLevelDetail:
            value: prototype
            basis: confirmed
            sourceIds: [11111111-1111-4111-8111-111111111111]
            evidenceIds: []
            method: null
          trlDetail:
            applicable: true
            value: 5
            basis: estimate
            sourceIds: [11111111-1111-4111-8111-111111111111]
            evidenceIds: []
            method: 'Mapped from "prototype tested in a laboratory environment" to TRL 5 by rule.'
          assessment:
            innovativeness:
              value: 62
              confidence: medium
              insufficientData: false
              sampleSize: 14
              basis: estimate
              sourceIds: [22222222-2222-4222-8222-222222222222]
              evidenceIds: [33333333-3333-4333-8333-333333333333]
              method: 'Distance to the 14 nearest records, plus counts of similar patents and papers.'
              explanation: '[MOCK] Fewer similar patents than the typical record in this area (evidence 3333).'
            applicationPotential:
              value: 48
              confidence: low
              insufficientData: false
              sampleSize: 6
              basis: estimate
              sourceIds: [22222222-2222-4222-8222-222222222222]
              evidenceIds: [33333333-3333-4333-8333-333333333333]
              method: 'Sectors found in similar records and documentation completeness.'
              explanation: null
            credibility:
              value: 71
              confidence: medium
              insufficientData: false
              sampleSize: 2
              basis: estimate
              sourceIds: [11111111-1111-4111-8111-111111111111, 22222222-2222-4222-8222-222222222222]
              evidenceIds: []
              method: 'Two independent sources, one official register.'
              explanation: null
          oslo:
            passed: true
            newOrImproved: true
            differsSignificantly: true
            availableOrInUse: true
            basis: estimate
            note: '[MOCK] Tested prototype exists, so it counts as available for testing.'
          couldAlsoBeUsedIn:
            - '[MOCK] Drone manufacturing'
            - '[MOCK] Industrial inspection'
          owner: { name: '[MOCK] Example University of Technology', url: 'https://example.invalid/lab' }
          sources:
            - id: 11111111-1111-4111-8111-111111111111
              type: crawl
              name: '[MOCK] University technology transfer page'
              url: 'https://example.invalid/transfer/sensor-housing'
              retrievedAt: '2026-11-22T06:00:00Z'
              passage: '[MOCK] "The prototype housing was tested in the laboratory in 2025."'
              license: null
            - id: 22222222-2222-4222-8222-222222222222
              type: api
              name: '[MOCK] Patent register'
              url: 'https://example.invalid/patent/PL123456'
              retrievedAt: '2026-11-22T06:05:00Z'
              passage: null
              license: CC0
          evidence:
            - id: 33333333-3333-4333-8333-333333333333
              metric: similar_patents_count
              value: 3
              unit: patents
              sourceId: 22222222-2222-4222-8222-222222222222
              query: 'classification G01D, keywords "sensor housing composite", Poland, 2015-2026'
              retrievedAt: '2026-11-22T06:05:00Z'
          firstSeenAt: '2026-11-21T20:00:00Z'
          statusChangedAt: '2026-11-22T06:10:00Z'


  parameters:
    Lang:
      name: lang
      in: query
      required: false
      description: Response language. Wins over `Accept-Language`. Send it or the header on every call. Any other value (also `UK`) returns `422 validation_failed`.
      schema: { $ref: '#/components/schemas/LanguageCode' }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: 'Standard header, for example `uk, pl;q=0.8`. The server picks the best supported match and falls back to `pl`.'
      schema: { type: string, maxLength: 200, examples: ['uk', 'en-GB,en;q=0.9,pl;q=0.5'] }
    Provider:
      name: provider
      in: path
      required: true
      description: A provider with `flow` `redirect` from `/auth/providers`.
      schema: { type: string, enum: [login_gov_pl, mojeid] }
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      description: Number of items to skip. At most 10000 (planned, G7); narrow the search instead.
      schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }

  headers:
    ContentLanguage:
      description: 'The languages actually served in this response, the requested one first. `uk, en` means some texts have no Ukrainian translation yet and are shown in English, so the UI can say so. An error message that is not translated yet is served in English with `Content-Language: en`.'
      schema: { type: string, examples: ['uk', 'uk, en', 'pl'] }
    Vary:
      description: Includes `Accept-Language`, so a cache never serves one language to a request for another.
      schema: { type: string, examples: ['Accept-Language'] }

  responses:
    BadRequest:
      description: The body is not valid JSON.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: bad_request, message: The request body is not valid JSON., details: [], requestId: 4f0c1c0e-6f2a-4f43-9a0e-2d1f3b7a9c10 }
    ValidationFailed:
      description: A parameter or body field is invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: validation_failed
              message: One or more fields are invalid.
              details:
                - { field: limit, issue: must be at most 100 }
              requestId: 4f0c1c0e-6f2a-4f43-9a0e-2d1f3b7a9c11
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: not_found, message: Card not found., details: [], requestId: 4f0c1c0e-6f2a-4f43-9a0e-2d1f3b7a9c12 }
    Unauthorized:
      description: Missing or invalid token.
      headers:
        WWW-Authenticate: { schema: { type: string, examples: ['Bearer'] } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: unauthorized, message: A valid token is required., details: [], requestId: 4f0c1c0e-6f2a-4f43-9a0e-2d1f3b7a9c13 }
    Forbidden:
      description: The token is valid but not allowed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: forbidden, message: This token cannot do that., details: [], requestId: 4f0c1c0e-6f2a-4f43-9a0e-2d1f3b7a9c14 }
    Conflict:
      description: The idempotency key was already used with a different request (`idempotency_conflict`), or a collection run is already active (`run_in_progress`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: idempotency_conflict, message: This key was used with a different body., details: [], requestId: 4f0c1c0e-6f2a-4f43-9a0e-2d1f3b7a9c15 }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 }, description: Seconds to wait. }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: rate_limited, message: Too many requests. Try again later., details: [], requestId: 4f0c1c0e-6f2a-4f43-9a0e-2d1f3b7a9c16 }
    Unavailable:
      description: A dependency is down.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Internal:
      description: Unexpected server error. The message never contains internal details.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: internal_error, message: Something went wrong. Quote the request id when you report it., details: [], requestId: 4f0c1c0e-6f2a-4f43-9a0e-2d1f3b7a9c17 }

  schemas:
    AuthProvider:
      type: object
      required: [id, label, kind, enabled]
      properties:
        id: { type: string, enum: [sandbox_id, login_gov_pl, mojeid] }
        label: { $ref: '#/components/schemas/LocalizedText' }
        kind:
          type: string
          enum: [sandbox, saml, oidc]
          description: '`sandbox` is a labelled demo provider. `saml` is the national login (Węzeł Krajowy). `oidc` is for later providers such as mojeID through a broker.'
        enabled: { type: boolean }
        flow:
          type: string
          enum: [direct, redirect]
          description: '`direct`: call `login` and `register` with `providerSubject` (sandbox only). `redirect`: call `/auth/{provider}/start`.'
        assuranceLevel: { $ref: '#/components/schemas/AssuranceLevel' }
        methods:
          type: array
          description: The ways a person can prove identity through this provider. The UI lists them, so users know that Profil Zaufany and mObywatel work.
          items: { type: string, enum: [profil_zaufany, mobywatel, e_dowod, bank, eidas] }
        demoIdentities:
          type: array
          description: Sandbox only. The shared demo identities the sign-in page offers. In production the sandbox accepts only these (planned, G1).
          items:
            type: object
            required: [subject, label]
            properties:
              subject: { type: string, minLength: 3, maxLength: 200 }
              label: { $ref: '#/components/schemas/LocalizedText' }
      examples:
        - { id: sandbox_id, label: 'Test identity (demo)', kind: sandbox, enabled: true, flow: direct, demoIdentities: [{ subject: demo-jury, label: 'Jury (shared demo)' }] }
        - { id: login_gov_pl, label: 'login.gov.pl (coming)', kind: saml, enabled: false, flow: redirect, assuranceLevel: substantial, methods: [profil_zaufany, mobywatel, e_dowod, bank] }

    WebUrl:
      type: string
      format: uri
      pattern: '^https?://'
      maxLength: 2048
      description: A link a person can follow. Only `http` and `https`, so a collected `javascript:` or `data:` link can never reach a page (G3).

    TagSlugList:
      type: array
      maxItems: 20
      items: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }

    RegionCode:
      type: string
      enum: [DS, KP, LU, LB, LD, MA, MZ, OP, PK, PD, PM, SL, SK, WN, WP, ZP]
      description: Voivodeship, ISO 3166-2:PL without the `PL-` prefix.

    AssuranceLevel:
      type: string
      enum: [none, low, substantial, high]
      description: eIDAS level of assurance of the identity check. `none` for the sandbox. We ask login.gov.pl for `substantial`.

    LanguageCode:
      type: string
      enum: [pl, en, uk]
      description: Supported languages. `pl` is the default and the fallback.

    RegistrationTicket:
      type: object
      required: [registrationTicket, provider, expiresAt, assuranceLevel]
      description: A verified identity with no account yet. Send the ticket to `/auth/register` with the role, affiliation and interests.
      properties:
        registrationTicket: { type: string }
        provider: { type: string, enum: [login_gov_pl, mojeid] }
        expiresAt: { type: string, format: date-time }
        assuranceLevel: { $ref: '#/components/schemas/AssuranceLevel' }
        suggestedDisplayName:
          type: [string, 'null']
          description: Given name and family name from the provider, for the user to keep or clear. Not stored unless the user keeps it.

    RegisterRequest:
      type: object
      required: [provider, email, role, affiliation, interests, acceptedTerms]
      description: Send `providerSubject` for the sandbox (`flow` `direct`), or `registrationTicket` for a redirect provider. Exactly one of the two, otherwise `422 validation_failed`. The ticket's provider must equal `provider`.
      oneOf:
        - title: Sandbox
          required: [providerSubject]
          properties:
            provider: { const: sandbox_id }
            providerSubject: { type: string }
            registrationTicket: false
        - title: Redirect provider
          required: [registrationTicket]
          properties:
            provider: { enum: [login_gov_pl, mojeid] }
            registrationTicket: { type: string }
            providerSubject: false
      additionalProperties: false
      properties:
        provider: { type: string, enum: [sandbox_id, login_gov_pl, mojeid] }
        providerSubject:
          type: string
          minLength: 3
          maxLength: 200
          description: Sandbox only. The user picks one of the demo identities. Never a national ID number.
        registrationTicket:
          type: string
          minLength: 32
          maxLength: 200
          description: From `/auth/exchange` (`202`). Single use. The backend takes the verified identity from the ticket, not from the client.
        preferredLanguage: { $ref: '#/components/schemas/LanguageCode' }
        email: { type: string, format: email, maxLength: 254, description: 'Not verified (G9).' }
        displayName: { type: string, maxLength: 120 }
        role: { $ref: '#/components/schemas/AudienceId' }
        affiliation:
          type: object
          required: [name, type]
          additionalProperties: false
          properties:
            name: { type: string, maxLength: 200 }
            type: { $ref: '#/components/schemas/OrganisationType' }
        interests:
          type: array
          maxItems: 20
          description: Tag slugs or areas.
          items: { type: string, maxLength: 60 }
        acceptedTerms:
          type: boolean
          const: true
          description: Must be true. The terms forbid misuse of the intellectual property on the cards. Otherwise `terms_not_accepted`.
        consentToContact:
          type: boolean
          default: false
          description: Optional. Allows PCI to contact the user about matching innovations. The email is not verified (G9), so PCI confirms it before the first contact.

    LoginRequest:
      type: object
      required: [provider, providerSubject]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [sandbox_id] }
        providerSubject: { type: string, minLength: 3, maxLength: 200 }

    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { $ref: '#/components/schemas/AudienceId' }
        affiliation:
          type: object
          required: [name, type]
          properties:
            name: { type: string, maxLength: 200 }
            type: { $ref: '#/components/schemas/OrganisationType' }
        interests:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 60 }
        consentToContact: { type: boolean }
        preferredLanguage: { $ref: '#/components/schemas/LanguageCode' }

    User:
      type: object
      required: [id, email, role, affiliation, interests, identityVerified, provider, consentToContact, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/AudienceId' }
        affiliation:
          type: object
          required: [name, type]
          properties:
            name: { type: string }
            type: { $ref: '#/components/schemas/OrganisationType' }
        interests: { type: array, items: { type: string } }
        identityVerified:
          type: boolean
          description: True only for a real identity provider. Always false for the sandbox, and the UI must say so.
        provider: { type: string, enum: [sandbox_id, login_gov_pl, mojeid] }
        assuranceLevel: { $ref: '#/components/schemas/AssuranceLevel' }
        preferredLanguage: { $ref: '#/components/schemas/LanguageCode' }
        consentToContact: { type: boolean }
        createdAt: { type: string, format: date-time }
      examples:
        - id: 5a0c7f3e-1b2d-4c3e-9f10-aa11bb22cc33
          email: mock.user@example.invalid
          displayName: '[MOCK] Anna'
          role: startups_enterprises
          affiliation: { name: '[MOCK] Example Startup', type: startup }
          interests: [robotics, education]
          identityVerified: false
          provider: sandbox_id
          consentToContact: false
          createdAt: '2026-11-22T07:00:00Z'

    Session:
      type: object
      required: [token, expiresAt, user]
      properties:
        token: { type: string, description: 'Send as `Authorization: Bearer <token>`. Keep it in memory or in an httpOnly cookie set by the web server, not in localStorage.' }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
      examples:
        - token: mock-session-token
          expiresAt: '2026-11-22T19:00:00Z'
          user:
            id: 5a0c7f3e-1b2d-4c3e-9f10-aa11bb22cc33
            email: mock.user@example.invalid
            displayName: '[MOCK] Anna'
            role: startups_enterprises
            affiliation: { name: '[MOCK] Example Startup', type: startup }
            interests: [robotics, education]
            identityVerified: false
            provider: sandbox_id
            consentToContact: false
            createdAt: '2026-11-22T07:00:00Z'

    OrganisationType:
      type: string
      enum: [university, research_institute, school, local_government, public_institution, company, startup, incubator, investor, individual, other]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, requestId]
          properties:
            code:
              type: string
              enum: [bad_request, validation_failed, not_found, unauthorized, forbidden, idempotency_conflict, run_in_progress, account_exists, registration_required, terms_not_accepted, rate_limited, source_unavailable, internal_error, auth_cancelled, auth_failed, state_invalid, assurance_too_low, provider_unavailable]
            message: { type: string, description: 'Human text in the negotiated language. Show it only as a fallback: the UI maps `code` to its own words.' }
            details:
              type: array
              items:
                type: object
                required: [field, issue]
                properties:
                  field: { type: string }
                  issue: { type: string }
            requestId: { type: string }

    PageMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }

    LocalizedText:
      description: |
        Text for people. When the request names a language (`lang` or `Accept-Language`), this is one string in that
        language. Otherwise it is the deprecated object form with every supported language. The backend refuses to load
        or create any card text that lacks one of the supported languages.
      oneOf:
        - type: string
        - $ref: '#/components/schemas/LocalizedTextMap'
      examples:
        - '[MOCK] Легкий корпус датчика'
        - { pl: '[MOCK] Lekka obudowa czujnika', en: '[MOCK] Lightweight sensor housing', uk: '[MOCK] Легкий корпус датчика' }

    LocalizedTextMap:
      type: object
      deprecated: true
      description: All languages at once. Only for requests that name no language. Removed in v2.
      minProperties: 1
      properties:
        pl: { type: string }
        en: { type: string }
        uk: { type: string }

    Area:
      type: string
      enum: [technological, educational, administrative]
      description: The three areas named in the organisers' FAQ.

    ImplementationLevel:
      type: string
      enum: [concept, prototype, testing, pilot, in_practice]
      description: The five steps named in the FAQ, in order.

    Basis:
      type: string
      enum: [confirmed, estimate]
      description: '`confirmed` means a stored source says so. `estimate` means we computed or inferred it.'

    Confidence:
      type: string
      enum: [low, medium, high]
      description: How much evidence stands behind a value. Computed from the number and age of evidence rows.

    AudienceId:
      type: string
      enum: [investors_business, public_bodies, universities, schools, startups_enterprises, inventors]

    SourceType:
      type: string
      enum: [api, crawl, document]
      description: How the Radar collected the data.

    Organisation:
      type: object
      required: [name, type]
      properties:
        name: { type: string, description: 'The organisation itself, for example Politechnika Koszalińska.' }
        unit: { type: [string, 'null'], description: 'A faculty or department when the source names one, for example Wydział Mechaniczny.' }
        type: { $ref: '#/components/schemas/OrganisationType' }
        url: { oneOf: [{ $ref: '#/components/schemas/WebUrl' }, { type: 'null' }] }
        region: { type: [string, 'null'], description: 'Region code, for example PK.' }

    Provenance:
      type: object
      required: [basis, sourceIds, evidenceIds]
      properties:
        basis: { $ref: '#/components/schemas/Basis' }
        sourceIds:
          type: array
          items: { type: string, format: uuid }
          description: Required to be non-empty when `basis` is `confirmed`.
        evidenceIds:
          type: array
          items: { type: string, format: uuid }
        method:
          type: [string, 'null']
          description: Required when `basis` is `estimate`. Short plain-language description of how it was made. English. Kept for compatibility, so show `methodText` when it is present.
        methodText:
          oneOf:
            - { $ref: '#/components/schemas/LocalizedText' }
            - { type: 'null' }
          description: The same text in the negotiated language. Use this in the UI. Each screen is in one language only.

    ImplementationLevelField:
      allOf:
        - $ref: '#/components/schemas/Provenance'
        - type: object
          required: [value]
          properties:
            value: { $ref: '#/components/schemas/ImplementationLevel' }

    TrlField:
      allOf:
        - $ref: '#/components/schemas/Provenance'
        - type: object
          required: [applicable, value]
          properties:
            applicable:
              type: boolean
              description: False for educational and administrative items. Then `value` is null.
            value: { type: [integer, 'null'], minimum: 1, maximum: 9 }

    Score:
      allOf:
        - $ref: '#/components/schemas/Provenance'
        - type: object
          required: [value, confidence, insufficientData]
          properties:
            value:
              type: [integer, 'null']
              minimum: 0
              maximum: 100
              description: Null when there is not enough data.
            confidence: { $ref: '#/components/schemas/Confidence' }
            insufficientData:
              type: boolean
              description: When true the screen says "not enough data" and shows `sampleSize`.
            sampleSize: { type: [integer, 'null'], minimum: 0 }
            explanation:
              oneOf:
                - { $ref: '#/components/schemas/LocalizedText' }
                - { type: 'null' }
              description: Written by the model from evidence ids only. Always an estimate. Never contains a number that is not in the evidence.

    Scores:
      type: object
      required: [innovativeness, applicationPotential, credibility]
      properties:
        innovativeness: { $ref: '#/components/schemas/Score' }
        applicationPotential: { $ref: '#/components/schemas/Score' }
        credibility: { $ref: '#/components/schemas/Score' }

    ScoresBrief:
      type: object
      description: Values only, for list views. Null means not enough data.
      required: [innovativeness, applicationPotential, credibility]
      properties:
        innovativeness: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        applicationPotential: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        credibility: { type: [integer, 'null'], minimum: 0, maximum: 100 }

    OsloCheck:
      type: object
      required: [passed, newOrImproved, differsSignificantly, availableOrInUse, basis]
      properties:
        passed: { type: boolean }
        newOrImproved: { type: boolean }
        differsSignificantly: { type: boolean }
        availableOrInUse: { type: boolean }
        basis: { $ref: '#/components/schemas/Basis' }
        note: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }

    CardSummary:
      type: object
      required: [id, title, summaryShort, area, tags, organisation, implementationLevel, trl, scores, polishIp, lastCheckedAt, stale, sourceCount, relevance]
      properties:
        id: { type: string, format: uuid }
        title: { $ref: '#/components/schemas/LocalizedText' }
        summaryShort:
          allOf: [{ $ref: '#/components/schemas/LocalizedText' }]
          description: One or two sentences. Estimate by nature (model-written from sources).
        area: { $ref: '#/components/schemas/Area' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
        organisation: { $ref: '#/components/schemas/Organisation' }
        implementationLevel:
          type: object
          required: [value, basis]
          properties:
            value: { $ref: '#/components/schemas/ImplementationLevel' }
            basis: { $ref: '#/components/schemas/Basis' }
        trl:
          type: object
          required: [applicable, value, basis]
          properties:
            applicable: { type: boolean }
            value: { type: [integer, 'null'], minimum: 1, maximum: 9 }
            basis: { $ref: '#/components/schemas/Basis' }
        scores: { $ref: '#/components/schemas/ScoresBrief' }
        polishIp: { type: boolean, description: 'True only when Polish intellectual property is confirmed (for example in the UPRP register). Same as `polishIpStatus` = confirmed.' }
        polishIpStatus:
          type: string
          enum: [confirmed, stated, unknown]
          description: '`confirmed`: verified. `stated`: a source names a Polish patent, application, invention, utility model or a Polish-built core technology, not yet verified. `unknown`: no such statement found. Show "stated" as "declared by the source, not verified".'
        lastCheckedAt: { type: string, format: date-time }
        stale:
          type: boolean
          description: 'True when `lastCheckedAt` is older than the freshness limit (default 30 days), or when the project the card describes ended more than `STALE_PROJECT_YEARS` (default 3) years ago (evidence `project_end_date`, issue #22).'
        sourceCount: { type: integer, minimum: 0 }
        relevance:
          type: [number, 'null']
          description: Search score. Null when there is no `q`.
      examples:
        - id: 7b1d5a52-3d0e-4c52-9a43-0a8e5f1c2d01
          title: '[MOCK] Lightweight sensor housing'
          summaryShort: '[MOCK] A composite housing for flight sensors, tested in a university lab.'
          area: technological
          tags: [{ slug: robotics, label: Robotics }, { slug: aviation, label: Aviation }]
          organisation: { name: '[MOCK] Example University of Technology', type: university, url: null, region: PK }
          implementationLevel: { value: prototype, basis: confirmed }
          trl: { applicable: true, value: 5, basis: estimate }
          scores: { innovativeness: 62, applicationPotential: 48, credibility: 71 }
          polishIp: true
          lastCheckedAt: '2026-11-22T06:10:00Z'
          stale: false
          sourceCount: 3
          relevance: 0.82

    Tag:
      type: object
      required: [slug, label]
      properties:
        slug: { type: string }
        label: { $ref: '#/components/schemas/LocalizedText' }

    Card:
      allOf:
        - $ref: '#/components/schemas/CardSummary'
        - type: object
          required: [summary, implementationLevelDetail, trlDetail, assessment, oslo, couldAlsoBeUsedIn, owner, sources, evidence, firstSeenAt, statusChangedAt]
          properties:
            summary:
              $ref: '#/components/schemas/LocalizedText'
            implementationLevelDetail: { $ref: '#/components/schemas/ImplementationLevelField' }
            trlDetail: { $ref: '#/components/schemas/TrlField' }
            assessment: { $ref: '#/components/schemas/Scores' }
            oslo: { $ref: '#/components/schemas/OsloCheck' }
            couldAlsoBeUsedIn:
              type: array
              description: Other institutions, organisations or industries. Estimate.
              items: { $ref: '#/components/schemas/LocalizedText' }
            owner:
              type: object
              description: Where to reach the owner. Always a public page. The Radar does not mediate contact.
              required: [name, url]
              properties:
                name: { type: string }
                url: { $ref: '#/components/schemas/WebUrl' }
            sources:
              type: array
              items: { $ref: '#/components/schemas/Source' }
            evidence:
              type: array
              items: { $ref: '#/components/schemas/Evidence' }
            firstSeenAt: { type: string, format: date-time }
            statusChangedAt: { type: [string, 'null'], format: date-time }
            relatedWork:
              type: array
              description: |
                Optional (draft 3). Everything the similarity and research steps found for this card, kept on the card:
                similar cards in the catalogue and external hits (papers, patents, research projects, transfer listings).
                Each hit names its organisation and a public contact page, so a reader sees who to reach.
                The Radar does not mediate contact and has no messaging (FAQ section 6).
              items: { $ref: '#/components/schemas/RelatedWork' }
            machineTranslated:
              type: array
              description: Optional (draft 3). Languages of this card's texts that come from machine translation and are not reviewed yet. The UI shows a note in those languages.
              items: { $ref: '#/components/schemas/LanguageCode' }

    RelatedWork:
      type: object
      required: [kind, title, url, similarity, basis, foundAt]
      properties:
        kind:
          type: string
          enum: [card, publication, patent, research_project, transfer_listing, web_page]
        cardId:
          type: [string, 'null']
          format: uuid
          description: Set when `kind` is `card`. Link to the card page.
        title:
          allOf: [{ $ref: '#/components/schemas/LocalizedText' }]
          description: |
            For an outside work (`kind` other than `card`): a plain string, the work's own title as its source writes it,
            not translated (like a source quote), with its language in `titleLang`. For `kind` `card`: the card's title,
            resolved to the negotiated language like every other `LocalizedText`.
        titleLang:
          type: [string, 'null']
          pattern: '^[a-z]{2}$'
          description: ISO 639-1 language of `title`. The UI sets `lang` on it. Null when unknown.
        url: { $ref: '#/components/schemas/WebUrl' }
        organisation:
          type: [object, 'null']
          required: [name]
          properties:
            name: { type: string }
            region: { oneOf: [{ $ref: '#/components/schemas/RegionCode' }, { type: 'null' }] }
            contactUrl:
              oneOf: [{ $ref: '#/components/schemas/WebUrl' }, { type: 'null' }]
              description: A public contact or transfer-office page. Never a private person's data.
        year: { type: [integer, 'null'] }
        similarity:
          type: number
          minimum: 0
          maximum: 1
          description: Computed by code (trigram, shared tags, later embeddings). Not written by the model.
        sharedTags:
          type: array
          description: Tag slugs the hit shares with this card. Explains the match in plain words.
          items: { type: string }
        basis: { $ref: '#/components/schemas/Basis' }
        source:
          type: string
          description: Where the hit came from, for example `catalogue`, `openalex`, `radon`, `ptt`.
        foundAt: { type: string, format: date-time }

    SourceConfigStatus:
      type: object
      required: [id, method, enabled, ready]
      properties:
        id: { type: string, description: 'Key in `data/sources/registry.json`.' }
        name: { $ref: '#/components/schemas/LocalizedText' }
        method: { type: string, enum: [api, crawl, sitemap, feed, document] }
        enabled: { type: boolean }
        tokenEnv: { type: [string, 'null'], description: 'Name of the environment variable that holds the token, for example `OPENALEX_API_KEY`.' }
        tokenPresent: { type: [boolean, 'null'], description: 'True when that variable is set. Null when the source needs no token. The value itself is never returned.' }
        robots: { type: [string, 'null'], enum: [allowed, disallowed, not_checked, not_applicable, null] }
        ready: { type: boolean, description: 'Enabled, token present if needed, and robots allows it.' }
        problem: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }

    Source:
      type: object
      required: [id, type, name, url, retrievedAt, passage]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/SourceType' }
        name: { type: string }
        url: { $ref: '#/components/schemas/WebUrl' }
        retrievedAt: { type: string, format: date-time }
        passage:
          type: [string, 'null']
          description: The quoted passage the fact came from, exactly as the source wrote it (usually Polish). Show it as a quotation with the language set in `passageLang`. Null for pure API numbers.
        nameText:
          allOf: [{ $ref: '#/components/schemas/LocalizedText' }]
          description: The source name in the negotiated language. The part after the colon is the source's own title, kept as written.
        licenseLabel:
          oneOf:
            - { $ref: '#/components/schemas/LocalizedText' }
            - { type: 'null' }
          description: The licence in the negotiated language. Null when the source states none.
        licenseUrl: { oneOf: [{ $ref: '#/components/schemas/WebUrl' }, { type: 'null' }] }
        passageLang:
          type: [string, 'null']
          pattern: '^[a-z]{2}$'
          description: Language of the quoted passage. The UI sets `lang` on the quotation, so a screen reader and the spell checker treat it correctly.
        license: { type: [string, 'null'] }

    SourceSummary:
      type: object
      required: [id, type, name, url, lastCollectedAt, cardCount]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/SourceType' }
        name: { type: string }
        url: { $ref: '#/components/schemas/WebUrl' }
        nameText: { $ref: '#/components/schemas/LocalizedText' }
        lastCollectedAt: { type: [string, 'null'], format: date-time }
        cardCount: { type: integer, minimum: 0 }
        license: { type: [string, 'null'] }

    Evidence:
      type: object
      required: [id, metric, value, unit, sourceId, query, retrievedAt]
      properties:
        id: { type: string, format: uuid }
        metric: { type: string, examples: [similar_publications_count], description: 'Machine name. Do not show it. Show `label`.' }
        label:
          oneOf:
            - { $ref: '#/components/schemas/LocalizedText' }
            - { type: 'null' }
          description: Name of the metric in the negotiated language. Null only for evidence made before this field existed.
        value: { type: [number, string, boolean] }
        unit: { type: [string, 'null'], description: As the source writes it. Show `unitLabel`. }
        unitLabel:
          oneOf:
            - { $ref: '#/components/schemas/LocalizedText' }
            - { type: 'null' }
        sourceId: { type: string, format: uuid }
        query: { type: string, description: 'The query or call that produced the value, as a technical line. Show `queryText`.' }
        retrievedAt: { type: string, format: date-time }
        origin:
          type: string
          enum: [source, computed]
          description: |
            Optional (draft 5, issue #18). `source`: the value comes from the linked source. `computed`: Pomysłownik
            computed it from the card's stored data (for example "number of cards compared"). Show computed rows apart,
            as "Obliczone przez Pomysłownik" / "Computed by Pomysłownik", **without** a source link: `sourceId` then only
            names the card source the computation started from, not a source that states the number.
        queryText:
          allOf: [{ $ref: '#/components/schemas/LocalizedText' }]
          description: Optional (draft 5). The query in the negotiated language. URLs and quoted source text inside it stay as written.

    StatusChange:
      type: object
      required: [at, field, from, to, sourceId]
      properties:
        at: { type: string, format: date-time }
        field:
          type: string
          enum: [implementationLevel, trl, organisation, other]
          description: '`other` covers source states (`source_ok`, `source_changed`, `source_unavailable`) and, since draft 5, the Polish IP status (`polish_ip_unknown`, `polish_ip_stated`, `polish_ip_confirmed`). Corrections by a reviewer are recorded too (issue #17).'
        from: { type: [string, 'null'], description: 'Machine value: a level id, a TRL number, or a source state (source_ok, source_changed, source_unavailable). Show `fromLabel`.' }
        to: { type: [string, 'null'], description: 'Machine value, as for `from`. Show `toLabel`.' }
        fromLabel:
          oneOf:
            - { $ref: '#/components/schemas/LocalizedText' }
            - { type: 'null' }
        toLabel:
          oneOf:
            - { $ref: '#/components/schemas/LocalizedText' }
            - { type: 'null' }
        sourceId: { type: [string, 'null'], format: uuid }

    CompareRow:
      type: object
      required: [key, label, cells]
      properties:
        key:
          type: string
          enum: [area, organisation, implementationLevel, trl, innovativeness, applicationPotential, credibility, polishIp, sourceCount, lastCheckedAt]
        label: { $ref: '#/components/schemas/LocalizedText' }
        cells:
          type: array
          description: One cell per card, in the order of `cards`.
          items:
            type: object
            required: [cardId, display, basis]
            properties:
              cardId: { type: string, format: uuid }
              display: { $ref: '#/components/schemas/LocalizedText', description: 'Ready-to-show text in the negotiated language.' }
              raw: { type: [number, string, boolean, 'null'] }
              basis: { oneOf: [{ $ref: '#/components/schemas/Basis' }, { type: 'null' }] }
              isBest: { type: boolean, description: True for the highest value in a numeric row. }

    FacetOption:
      type: object
      required: [value, label, count]
      properties:
        value: { type: string }
        label: { $ref: '#/components/schemas/LocalizedText' }
        count: { type: integer, minimum: 0 }

    Audience:
      type: object
      required: [id, label, description, defaultFilters, highlightedFields]
      properties:
        id: { $ref: '#/components/schemas/AudienceId' }
        label: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
        defaultFilters:
          $ref: '#/components/schemas/CardFilters'
        highlightedFields:
          type: array
          description: Card fields to show first for this audience.
          items:
            type: string
            enum: [implementationLevel, trl, innovativeness, applicationPotential, credibility, polishIp, organisation]
      examples:
        - id: startups_enterprises
          label: Startups and enterprises
          description: 'Ready or nearly ready solutions to use, license or integrate.'
          defaultFilters: { implementationLevel: [pilot, in_practice] }
          highlightedFields: [implementationLevel, applicationPotential, credibility]

    CardFilters:
      type: object
      description: The filter parameters of `/api/v1/cards` as JSON. Arrays are sent comma separated in the query string.
      additionalProperties: false
      properties:
        area: { type: array, items: { $ref: '#/components/schemas/Area' } }
        implementationLevel: { type: array, items: { $ref: '#/components/schemas/ImplementationLevel' } }
        trlMin: { type: integer, minimum: 1, maximum: 9 }
        trlMax: { type: integer, minimum: 1, maximum: 9 }
        tag: { $ref: '#/components/schemas/TagSlugList' }
        region: { $ref: '#/components/schemas/RegionCode' }
        polishIp: { type: boolean }
        minCredibility: { type: integer, minimum: 0, maximum: 100 }

    OverviewStats:
      type: object
      required: [cardCount, byArea, byImplementationLevel, sourceCount, sourcesByType, lastRefreshAt, staleShare, confirmedFieldShare]
      properties:
        cardCount: { type: integer, minimum: 0 }
        byArea:
          type: object
          required: [technological, educational, administrative]
          properties:
            technological: { type: integer, minimum: 0 }
            educational: { type: integer, minimum: 0 }
            administrative: { type: integer, minimum: 0 }
        byImplementationLevel:
          type: object
          required: [concept, prototype, testing, pilot, in_practice]
          properties:
            concept: { type: integer, minimum: 0 }
            prototype: { type: integer, minimum: 0 }
            testing: { type: integer, minimum: 0 }
            pilot: { type: integer, minimum: 0 }
            in_practice: { type: integer, minimum: 0 }
        sourceCount: { type: integer, minimum: 0 }
        sourcesByType:
          type: object
          required: [api, crawl, document]
          properties:
            api: { type: integer, minimum: 0 }
            crawl: { type: integer, minimum: 0 }
            document: { type: integer, minimum: 0 }
        lastRefreshAt: { type: [string, 'null'], format: date-time }
        staleShare: { type: number, minimum: 0, maximum: 1, description: Share of cards flagged stale. }
        confirmedFieldShare: { type: number, minimum: 0, maximum: 1, description: Share of assessed fields with basis confirmed. }
        polishIpCount: { type: integer, minimum: 0 }
      examples:
        - cardCount: 48
          byArea: { technological: 22, educational: 14, administrative: 12 }
          byImplementationLevel: { concept: 6, prototype: 12, testing: 8, pilot: 9, in_practice: 13 }
          sourceCount: 17
          sourcesByType: { api: 6, crawl: 8, document: 3 }
          lastRefreshAt: '2026-11-22T06:10:00Z'
          staleShare: 0.08
          confirmedFieldShare: 0.64
          polishIpCount: 15

    UsageEvent:
      type: object
      required: [eventId, type, occurredAt]
      additionalProperties: false
      description: Closed set of fields on purpose. There is no free text and no user identifier. The server adds the role.
      properties:
        eventId: { type: string, format: uuid, description: Generated by the client. Makes retries safe. }
        type: { type: string, enum: [search_performed, card_viewed, compare_opened, filter_used] }
        occurredAt: { type: string, format: date-time }
        audience: { $ref: '#/components/schemas/AudienceId' }
        area: { $ref: '#/components/schemas/Area' }
        tags:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 60 }
        cardId: { type: string, format: uuid }
        resultCount: { type: integer, minimum: 0 }

    UsageStats:
      type: object
      required: [period, totalSearches, totalCardViews, topAreas, topTags, mostViewedCards, searchesByAudience]
      properties:
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        totalSearches: { type: integer, minimum: 0 }
        totalCardViews: { type: integer, minimum: 0 }
        topAreas: { type: array, items: { $ref: '#/components/schemas/CountItem' } }
        topTags: { type: array, items: { $ref: '#/components/schemas/CountItem' } }
        mostViewedCards:
          type: array
          items:
            type: object
            required: [cardId, title, views]
            properties:
              cardId: { type: string, format: uuid }
              title: { $ref: '#/components/schemas/LocalizedText' }
              views: { type: integer, minimum: 0 }
        searchesByAudience: { type: array, items: { $ref: '#/components/schemas/CountItem' } }

    CountItem:
      type: object
      required: [value, count]
      properties:
        value: { type: string, description: 'Machine value (an area id, tag slug or audience id). Do not show it. Show `label`.' }
        label:
          oneOf:
            - { $ref: '#/components/schemas/LocalizedText' }
            - { type: 'null' }
          description: The value's name in the negotiated language.
        count: { type: integer, minimum: 0 }

    CollectRun:
      type: object
      required: [id, mode, status, startedAt, finishedAt, summary]
      properties:
        id: { type: string, format: uuid }
        mode: { type: string, enum: [collect, refresh] }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        summary:
          type: object
          required: [cardsAdded, cardsUpdated, statusChanges, errors]
          properties:
            cardsAdded: { type: integer, minimum: 0 }
            cardsUpdated: { type: integer, minimum: 0 }
            statusChanges: { type: integer, minimum: 0 }
            errors: { type: integer, minimum: 0 }
            cardsChecked: { type: integer, minimum: 0, description: Cards whose sources were re-read (refresh). }
        changedCardIds:
          type: array
          description: Cards added, updated or with a status change in this run. Open them to show the change.
          items: { type: string, format: uuid }
