  parameters:
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      description: Number of items to skip.
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    BadRequest:
      description: The body is not valid JSON.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: bad_request, message: The request body is not valid JSON., details: [], requestId: 4f0c1c0e-6f2a-4f43-9a0e-2d1f3b7a9c10 }
    ValidationFailed:
      description: A parameter or body field is invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: validation_failed
              message: One or more fields are invalid.
              details:
                - { field: limit, issue: must be at most 100 }
              requestId: 4f0c1c0e-6f2a-4f43-9a0e-2d1f3b7a9c11
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: not_found, message: Card not found., details: [], requestId: 4f0c1c0e-6f2a-4f43-9a0e-2d1f3b7a9c12 }
    Unauthorized:
      description: Missing or invalid token.
      headers:
        WWW-Authenticate: { schema: { type: string, examples: ['Bearer'] } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: unauthorized, message: A valid token is required., details: [], requestId: 4f0c1c0e-6f2a-4f43-9a0e-2d1f3b7a9c13 }
    Forbidden:
      description: The token is valid but not allowed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: forbidden, message: This token cannot do that., details: [], requestId: 4f0c1c0e-6f2a-4f43-9a0e-2d1f3b7a9c14 }
    Conflict:
      description: The idempotency key was already used with a different request (`idempotency_conflict`), or a collection run is already active (`run_in_progress`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: idempotency_conflict, message: This key was used with a different body., details: [], requestId: 4f0c1c0e-6f2a-4f43-9a0e-2d1f3b7a9c15 }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 }, description: Seconds to wait. }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: rate_limited, message: Too many requests. Try again later., details: [], requestId: 4f0c1c0e-6f2a-4f43-9a0e-2d1f3b7a9c16 }
    Unavailable:
      description: A dependency is down.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Internal:
      description: Unexpected server error. The message never contains internal details.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: internal_error, message: Something went wrong. Quote the request id when you report it., details: [], requestId: 4f0c1c0e-6f2a-4f43-9a0e-2d1f3b7a9c17 }

  schemas:
    AuthProvider:
      type: object
      required: [id, label, kind, enabled]
      properties:
        id: { type: string, enum: [sandbox_id, login_gov_pl] }
        label: { $ref: '#/components/schemas/LocalizedText' }
        kind:
          type: string
          enum: [sandbox, saml]
          description: '`sandbox` is a labelled demo provider. `saml` is the real national login, not available yet.'
        enabled: { type: boolean }
      examples:
        - { id: sandbox_id, label: { pl: 'Tożsamość testowa (demo)', en: 'Test identity (demo)' }, kind: sandbox, enabled: true }

    RegisterRequest:
      type: object
      required: [provider, providerSubject, email, role, affiliation, interests, acceptedTerms]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [sandbox_id] }
        providerSubject:
          type: string
          minLength: 3
          maxLength: 200
          description: Identity from the provider. In the sandbox the user picks one of the demo identities. Never a national ID number.
        email: { type: string, format: email }
        displayName: { type: string, maxLength: 120 }
        role: { $ref: '#/components/schemas/AudienceId' }
        affiliation:
          type: object
          required: [name, type]
          properties:
            name: { type: string, maxLength: 200 }
            type: { $ref: '#/components/schemas/OrganisationType' }
        interests:
          type: array
          maxItems: 20
          description: Tag slugs or areas.
          items: { type: string, maxLength: 60 }
        acceptedTerms:
          type: boolean
          const: true
          description: Must be true. The terms forbid misuse of the intellectual property on the cards. Otherwise `terms_not_accepted`.
        consentToContact:
          type: boolean
          default: false
          description: Optional. Allows PCI to contact the user about matching innovations.

    LoginRequest:
      type: object
      required: [provider, providerSubject]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [sandbox_id] }
        providerSubject: { type: string, minLength: 3, maxLength: 200 }

    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { $ref: '#/components/schemas/AudienceId' }
        affiliation:
          type: object
          required: [name, type]
          properties:
            name: { type: string, maxLength: 200 }
            type: { $ref: '#/components/schemas/OrganisationType' }
        interests:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 60 }
        consentToContact: { type: boolean }

    User:
      type: object
      required: [id, email, role, affiliation, interests, identityVerified, provider, consentToContact, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/AudienceId' }
        affiliation:
          type: object
          required: [name, type]
          properties:
            name: { type: string }
            type: { $ref: '#/components/schemas/OrganisationType' }
        interests: { type: array, items: { type: string } }
        identityVerified:
          type: boolean
          description: True only for a real identity provider. Always false for the sandbox, and the UI must say so.
        provider: { type: string, enum: [sandbox_id, login_gov_pl] }
        consentToContact: { type: boolean }
        createdAt: { type: string, format: date-time }
      examples:
        - id: 5a0c7f3e-1b2d-4c3e-9f10-aa11bb22cc33
          email: mock.user@example.invalid
          displayName: '[MOCK] Anna'
          role: startups_enterprises
          affiliation: { name: '[MOCK] Example Startup', type: startup }
          interests: [robotics, education]
          identityVerified: false
          provider: sandbox_id
          consentToContact: false
          createdAt: '2026-11-22T07:00:00Z'

    Session:
      type: object
      required: [token, expiresAt, user]
      properties:
        token: { type: string, description: 'Send as `Authorization: Bearer <token>`. Keep it in memory or in an httpOnly cookie set by the web server, not in localStorage.' }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
      examples:
        - token: mock-session-token
          expiresAt: '2026-11-22T19:00:00Z'
          user:
            id: 5a0c7f3e-1b2d-4c3e-9f10-aa11bb22cc33
            email: mock.user@example.invalid
            displayName: '[MOCK] Anna'
            role: startups_enterprises
            affiliation: { name: '[MOCK] Example Startup', type: startup }
            interests: [robotics, education]
            identityVerified: false
            provider: sandbox_id
            consentToContact: false
            createdAt: '2026-11-22T07:00:00Z'

    OrganisationType:
      type: string
      enum: [university, research_institute, school, local_government, public_institution, company, startup, incubator, investor, individual, other]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, requestId]
          properties:
            code:
              type: string
              enum: [bad_request, validation_failed, not_found, unauthorized, forbidden, idempotency_conflict, run_in_progress, account_exists, registration_required, terms_not_accepted, rate_limited, source_unavailable, internal_error]
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [field, issue]
                properties:
                  field: { type: string }
                  issue: { type: string }
            requestId: { type: string }

    PageMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }

    LocalizedText:
      type: object
      description: At least one language is present.
      minProperties: 1
      properties:
        pl: { type: string }
        en: { type: string }
      examples:
        - { pl: '[MOCK] Lekka obudowa czujnika', en: '[MOCK] Lightweight sensor housing' }

    Area:
      type: string
      enum: [technological, educational, administrative]
      description: The three areas named in the organisers' FAQ.

    ImplementationLevel:
      type: string
      enum: [concept, prototype, testing, pilot, in_practice]
      description: The five steps named in the FAQ, in order.

    Basis:
      type: string
      enum: [confirmed, estimate]
      description: '`confirmed` means a stored source says so. `estimate` means we computed or inferred it.'

    Confidence:
      type: string
      enum: [low, medium, high]
      description: How much evidence stands behind a value. Computed from the number and age of evidence rows.

    AudienceId:
      type: string
      enum: [investors_business, public_bodies, universities, schools, startups_enterprises, inventors]

    SourceType:
      type: string
      enum: [api, crawl, document]
      description: How the Radar collected the data.

    Organisation:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { $ref: '#/components/schemas/OrganisationType' }
        url: { type: [string, 'null'], format: uri }
        region: { type: [string, 'null'], description: 'Region code, for example PK.' }

    Provenance:
      type: object
      required: [basis, sourceIds, evidenceIds]
      properties:
        basis: { $ref: '#/components/schemas/Basis' }
        sourceIds:
          type: array
          items: { type: string, format: uuid }
          description: Required to be non-empty when `basis` is `confirmed`.
        evidenceIds:
          type: array
          items: { type: string, format: uuid }
        method:
          type: [string, 'null']
          description: Required when `basis` is `estimate`. Short plain-language description of how it was made.

    ImplementationLevelField:
      allOf:
        - $ref: '#/components/schemas/Provenance'
        - type: object
          required: [value]
          properties:
            value: { $ref: '#/components/schemas/ImplementationLevel' }

    TrlField:
      allOf:
        - $ref: '#/components/schemas/Provenance'
        - type: object
          required: [applicable, value]
          properties:
            applicable:
              type: boolean
              description: False for educational and administrative items. Then `value` is null.
            value: { type: [integer, 'null'], minimum: 1, maximum: 9 }

    Score:
      allOf:
        - $ref: '#/components/schemas/Provenance'
        - type: object
          required: [value, confidence, insufficientData]
          properties:
            value:
              type: [integer, 'null']
              minimum: 0
              maximum: 100
              description: Null when there is not enough data.
            confidence: { $ref: '#/components/schemas/Confidence' }
            insufficientData:
              type: boolean
              description: When true the screen says "not enough data" and shows `sampleSize`.
            sampleSize: { type: [integer, 'null'], minimum: 0 }
            explanation:
              oneOf:
                - { $ref: '#/components/schemas/LocalizedText' }
                - { type: 'null' }
              description: Written by the model from evidence ids only. Always an estimate. Never contains a number that is not in the evidence.

    Scores:
      type: object
      required: [innovativeness, applicationPotential, credibility]
      properties:
        innovativeness: { $ref: '#/components/schemas/Score' }
        applicationPotential: { $ref: '#/components/schemas/Score' }
        credibility: { $ref: '#/components/schemas/Score' }

    ScoresBrief:
      type: object
      description: Values only, for list views. Null means not enough data.
      required: [innovativeness, applicationPotential, credibility]
      properties:
        innovativeness: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        applicationPotential: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        credibility: { type: [integer, 'null'], minimum: 0, maximum: 100 }

    OsloCheck:
      type: object
      required: [passed, newOrImproved, differsSignificantly, availableOrInUse, basis]
      properties:
        passed: { type: boolean }
        newOrImproved: { type: boolean }
        differsSignificantly: { type: boolean }
        availableOrInUse: { type: boolean }
        basis: { $ref: '#/components/schemas/Basis' }
        note: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }

    CardSummary:
      type: object
      required: [id, title, summaryShort, area, tags, organisation, implementationLevel, trl, scores, polishIp, lastCheckedAt, stale, sourceCount, relevance]
      properties:
        id: { type: string, format: uuid }
        title: { $ref: '#/components/schemas/LocalizedText' }
        summaryShort:
          allOf: [{ $ref: '#/components/schemas/LocalizedText' }]
          description: One or two sentences. Estimate by nature (model-written from sources).
        area: { $ref: '#/components/schemas/Area' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
        organisation: { $ref: '#/components/schemas/Organisation' }
        implementationLevel:
          type: object
          required: [value, basis]
          properties:
            value: { $ref: '#/components/schemas/ImplementationLevel' }
            basis: { $ref: '#/components/schemas/Basis' }
        trl:
          type: object
          required: [applicable, value, basis]
          properties:
            applicable: { type: boolean }
            value: { type: [integer, 'null'], minimum: 1, maximum: 9 }
            basis: { $ref: '#/components/schemas/Basis' }
        scores: { $ref: '#/components/schemas/ScoresBrief' }
        polishIp: { type: boolean, description: 'True when a Polish patent, utility model or Polish origin is confirmed.' }
        lastCheckedAt: { type: string, format: date-time }
        stale:
          type: boolean
          description: True when `lastCheckedAt` is older than the freshness limit (default 30 days).
        sourceCount: { type: integer, minimum: 0 }
        relevance:
          type: [number, 'null']
          description: Search score. Null when there is no `q`.
      examples:
        - id: 7b1d5a52-3d0e-4c52-9a43-0a8e5f1c2d01
          title: { pl: '[MOCK] Lekka obudowa czujnika', en: '[MOCK] Lightweight sensor housing' }
          summaryShort: { en: '[MOCK] A composite housing for flight sensors, tested in a university lab.' }
          area: technological
          tags: [{ slug: robotics, label: { pl: Robotyka, en: Robotics } }, { slug: aviation, label: { pl: Lotnictwo, en: Aviation } }]
          organisation: { name: '[MOCK] Example University of Technology', type: university, url: null, region: PK }
          implementationLevel: { value: prototype, basis: confirmed }
          trl: { applicable: true, value: 5, basis: estimate }
          scores: { innovativeness: 62, applicationPotential: 48, credibility: 71 }
          polishIp: true
          lastCheckedAt: '2026-11-22T06:10:00Z'
          stale: false
          sourceCount: 3
          relevance: 0.82

    Tag:
      type: object
      required: [slug, label]
      properties:
        slug: { type: string }
        label: { $ref: '#/components/schemas/LocalizedText' }

    Card:
      allOf:
        - $ref: '#/components/schemas/CardSummary'
        - type: object
          required: [summary, implementationLevelDetail, trlDetail, assessment, oslo, couldAlsoBeUsedIn, owner, sources, evidence, firstSeenAt, statusChangedAt]
          properties:
            summary:
              $ref: '#/components/schemas/LocalizedText'
            implementationLevelDetail: { $ref: '#/components/schemas/ImplementationLevelField' }
            trlDetail: { $ref: '#/components/schemas/TrlField' }
            assessment: { $ref: '#/components/schemas/Scores' }
            oslo: { $ref: '#/components/schemas/OsloCheck' }
            couldAlsoBeUsedIn:
              type: array
              description: Other institutions, organisations or industries. Estimate.
              items: { $ref: '#/components/schemas/LocalizedText' }
            owner:
              type: object
              description: Where to reach the owner. Always a public page. The Radar does not mediate contact.
              required: [name, url]
              properties:
                name: { type: string }
                url: { type: string, format: uri }
            sources:
              type: array
              items: { $ref: '#/components/schemas/Source' }
            evidence:
              type: array
              items: { $ref: '#/components/schemas/Evidence' }
            firstSeenAt: { type: string, format: date-time }
            statusChangedAt: { type: [string, 'null'], format: date-time }

    Source:
      type: object
      required: [id, type, name, url, retrievedAt, passage]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/SourceType' }
        name: { type: string }
        url: { type: string, format: uri }
        retrievedAt: { type: string, format: date-time }
        passage:
          type: [string, 'null']
          description: The quoted passage the fact came from. Null for pure API numbers.
        license: { type: [string, 'null'] }

    SourceSummary:
      type: object
      required: [id, type, name, url, lastCollectedAt, cardCount]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/SourceType' }
        name: { type: string }
        url: { type: string, format: uri }
        lastCollectedAt: { type: [string, 'null'], format: date-time }
        cardCount: { type: integer, minimum: 0 }
        license: { type: [string, 'null'] }

    Evidence:
      type: object
      required: [id, metric, value, unit, sourceId, query, retrievedAt]
      properties:
        id: { type: string, format: uuid }
        metric: { type: string, examples: [similar_publications_count] }
        value: { type: [number, string, boolean] }
        unit: { type: [string, 'null'] }
        sourceId: { type: string, format: uuid }
        query: { type: string, description: The query or call that produced the value. }
        retrievedAt: { type: string, format: date-time }

    StatusChange:
      type: object
      required: [at, field, from, to, sourceId]
      properties:
        at: { type: string, format: date-time }
        field: { type: string, enum: [implementationLevel, trl, organisation, other] }
        from: { type: [string, 'null'] }
        to: { type: [string, 'null'] }
        sourceId: { type: [string, 'null'], format: uuid }

    CompareRow:
      type: object
      required: [key, label, cells]
      properties:
        key:
          type: string
          enum: [area, organisation, implementationLevel, trl, innovativeness, applicationPotential, credibility, polishIp, sourceCount, lastCheckedAt]
        label: { $ref: '#/components/schemas/LocalizedText' }
        cells:
          type: array
          description: One cell per card, in the order of `cards`.
          items:
            type: object
            required: [cardId, display, basis]
            properties:
              cardId: { type: string, format: uuid }
              display: { type: string, description: Ready-to-show text. }
              raw: { type: [number, string, boolean, 'null'] }
              basis: { oneOf: [{ $ref: '#/components/schemas/Basis' }, { type: 'null' }] }
              isBest: { type: boolean, description: True for the highest value in a numeric row. }

    FacetOption:
      type: object
      required: [value, label, count]
      properties:
        value: { type: string }
        label: { $ref: '#/components/schemas/LocalizedText' }
        count: { type: integer, minimum: 0 }

    Audience:
      type: object
      required: [id, label, description, defaultFilters, highlightedFields]
      properties:
        id: { $ref: '#/components/schemas/AudienceId' }
        label: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
        defaultFilters:
          $ref: '#/components/schemas/CardFilters'
        highlightedFields:
          type: array
          description: Card fields to show first for this audience.
          items:
            type: string
            enum: [implementationLevel, trl, innovativeness, applicationPotential, credibility, polishIp, organisation]
      examples:
        - id: startups_enterprises
          label: { pl: Startupy i przedsiębiorstwa, en: Startups and enterprises }
          description: { en: 'Ready or nearly ready solutions to use, license or integrate.' }
          defaultFilters: { implementationLevel: [pilot, in_practice] }
          highlightedFields: [implementationLevel, applicationPotential, credibility]

    CardFilters:
      type: object
      description: The filter parameters of `/api/v1/cards` as JSON. Arrays are sent comma separated in the query string.
      additionalProperties: false
      properties:
        area: { type: array, items: { $ref: '#/components/schemas/Area' } }
        implementationLevel: { type: array, items: { $ref: '#/components/schemas/ImplementationLevel' } }
        trlMin: { type: integer, minimum: 1, maximum: 9 }
        trlMax: { type: integer, minimum: 1, maximum: 9 }
        tag: { type: array, items: { type: string } }
        region: { type: string }
        polishIp: { type: boolean }
        minCredibility: { type: integer, minimum: 0, maximum: 100 }

    OverviewStats:
      type: object
      required: [cardCount, byArea, byImplementationLevel, sourceCount, sourcesByType, lastRefreshAt, staleShare, confirmedFieldShare]
      properties:
        cardCount: { type: integer, minimum: 0 }
        byArea:
          type: object
          required: [technological, educational, administrative]
          properties:
            technological: { type: integer, minimum: 0 }
            educational: { type: integer, minimum: 0 }
            administrative: { type: integer, minimum: 0 }
        byImplementationLevel:
          type: object
          required: [concept, prototype, testing, pilot, in_practice]
          properties:
            concept: { type: integer, minimum: 0 }
            prototype: { type: integer, minimum: 0 }
            testing: { type: integer, minimum: 0 }
            pilot: { type: integer, minimum: 0 }
            in_practice: { type: integer, minimum: 0 }
        sourceCount: { type: integer, minimum: 0 }
        sourcesByType:
          type: object
          required: [api, crawl, document]
          properties:
            api: { type: integer, minimum: 0 }
            crawl: { type: integer, minimum: 0 }
            document: { type: integer, minimum: 0 }
        lastRefreshAt: { type: [string, 'null'], format: date-time }
        staleShare: { type: number, minimum: 0, maximum: 1, description: Share of cards flagged stale. }
        confirmedFieldShare: { type: number, minimum: 0, maximum: 1, description: Share of assessed fields with basis confirmed. }
        polishIpCount: { type: integer, minimum: 0 }
