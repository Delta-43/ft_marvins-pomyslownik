          polishIpCount: 15

    UsageEvent:
      type: object
      required: [eventId, type, occurredAt]
      additionalProperties: false
      description: Closed set of fields on purpose. There is no free text and no user identifier. The server adds the role.
      properties:
        eventId: { type: string, format: uuid, description: Generated by the client. Makes retries safe. }
        type: { type: string, enum: [search_performed, card_viewed, compare_opened, filter_used] }
        occurredAt: { type: string, format: date-time }
        audience: { $ref: '#/components/schemas/AudienceId' }
        area: { $ref: '#/components/schemas/Area' }
        tags:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 60 }
        cardId: { type: string, format: uuid }
        resultCount: { type: integer, minimum: 0 }

    UsageStats:
      type: object
      required: [period, totalSearches, totalCardViews, topAreas, topTags, mostViewedCards, searchesByAudience]
      properties:
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        totalSearches: { type: integer, minimum: 0 }
        totalCardViews: { type: integer, minimum: 0 }
        topAreas: { type: array, items: { $ref: '#/components/schemas/CountItem' } }
        topTags: { type: array, items: { $ref: '#/components/schemas/CountItem' } }
        mostViewedCards:
          type: array
          items:
            type: object
            required: [cardId, title, views]
            properties:
              cardId: { type: string, format: uuid }
              title: { $ref: '#/components/schemas/LocalizedText' }
              views: { type: integer, minimum: 0 }
        searchesByAudience: { type: array, items: { $ref: '#/components/schemas/CountItem' } }

    CountItem:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer, minimum: 0 }

    CollectRun:
      type: object
      required: [id, mode, status, startedAt, finishedAt, summary]
      properties:
        id: { type: string, format: uuid }
        mode: { type: string, enum: [collect, refresh] }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        summary:
          type: object
          required: [cardsAdded, cardsUpdated, statusChanges, errors]
          properties:
            cardsAdded: { type: integer, minimum: 0 }
            cardsUpdated: { type: integer, minimum: 0 }
            statusChanges: { type: integer, minimum: 0 }
            errors: { type: integer, minimum: 0 }
