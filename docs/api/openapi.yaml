openapi: 3.1.0
info:
  title: Innovation Radar API
  version: 1.0.0-draft.2
  summary: Read API for the Innovation Radar prototype (Hacknation 2026, PCI challenge).
  description: |
    Contract-first draft. The frontend builds against this file with a mock server.
    The backend implements it. If either side needs a change, change this file first.

    **Product rules that shape the API**
    - The Radar finds innovations that already exist. There is no endpoint to submit an idea.
    - **Everyone signs in** and picks a role (one of the six audiences). This deters misuse of the
      intellectual property described on the cards. Only `/health`, `/api/v1/audiences` and `/api/v1/auth/*`
      work without a session. Every other endpoint needs `Authorization: Bearer <session token>`.
    - Sign-in uses an identity provider. For the demo the provider is a clearly labelled **sandbox**. The real
      national login (login.gov.pl) needs SAML onboarding and will replace it with a redirect flow later.
    - The `/admin` endpoints need the separate admin token.
    - Every assessed field says whether it is a **confirmed** fact (with sources) or an **estimate**
      (with the method). The model never produces a number. Scores come from stored evidence.
    - Usage statistics stay aggregated. Events carry no free text. The server attaches the user's role,
      not the user id, to each event.

    **Conventions**
    - Base path `/api/v1`. Changes inside v1 only add optional fields or endpoints.
    - JSON, `camelCase`, UTF-8. Timestamps are RFC 3339 in UTC.
    - Every success body is `{ "data": ... }`. List bodies add `meta` with `total`, `limit`, `offset`.
    - Every error body is `{ "error": { "code", "message", "details", "requestId" } }`.
    - Malformed JSON returns `400 bad_request`. A well-formed but invalid value returns `422 validation_failed`.
    - Text for people is `LocalizedText` (`pl`, `en`). The frontend picks the language and falls back to the other.
    - CORS: the API allows the web origins listed in the `CORS_ORIGINS` environment variable.
    - Rate limiting: a `429` carries a `Retry-After` header (seconds).

    **Status of this draft**
    Mock example data is fictional and starts with `[MOCK]`. Field names are agreed by the team only when
    this file is merged. Open questions are in `docs/api/CONTRACT-REVIEW.md`.
  license:
    name: EUPL-1.2
    url: https://eupl.eu/1.2/en
servers:
  - url: http://localhost:4010
    description: Mock server (Prism), for frontend work
  - url: http://localhost:8000
    description: Local backend
  - url: https://api.example.invalid
    description: Delta-server behind the tunnel. Replace with the real host when it exists
# Signed in by default. Public operations say `security: []`. Admin operations use the admin token.
security:
  - userBearer: []
tags:
  - name: Auth
    description: Sign in, register with a role, sign out, read and edit your profile.
  - name: Cards
    description: Search, read and compare innovation cards. Signed-in users.
  - name: Reference
    description: Filter options, audience presets (public, used by the registration form), sources.
  - name: Statistics
    description: Aggregate numbers for the overview and for PCI. Signed-in users.
  - name: Events
    description: Usage events. Signed-in users. No free text.
  - name: Admin
    description: Trigger and inspect collection runs. Needs a bearer token.
  - name: System
    description: Health.

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      summary: Liveness and dependency check
      description: Not versioned. Used by container healthchecks and the tunnel monitor.
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, version, database]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  version: { type: string, examples: ['1.0.0-draft.1'] }
                  database: { type: string, enum: [up, down] }
                  lastRefreshAt:
                    type: [string, 'null']
                    format: date-time
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/v1/auth/providers:
    get:
      tags: [Auth]
      operationId: listAuthProviders
      summary: Identity providers the user can sign in with
      security: []
      responses:
        '200':
          description: Providers. In the demo only `sandbox_id` is enabled.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuthProvider' }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account with a verified identity and a role
      description: |
        The identity comes from the provider (`providerSubject`). The user picks one role, states an affiliation
        and interests, and must accept the terms of use, which forbid misuse of the intellectual property on the cards.
        Returns a session, so the user is signed in at once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and signed in.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: An account already exists for this identity (`account_exists`). Sign in instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with an identity from a provider
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: No account for this identity (`registration_required`). Go to registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session
      responses:
        '204':
          description: Signed out. Safe to repeat.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: The signed-in user's profile
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Auth]
      operationId: deleteMe
      summary: Delete the account and its personal data (GDPR right to erasure)
      description: Removes email, affiliation and interests, and ends all sessions. Aggregated usage counts stay, because they hold no user id.
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Auth]
      operationId: updateMe
      summary: Change role, affiliation or interests
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/cards:
    get:
      tags: [Cards]
      operationId: searchCards
      summary: Search and filter innovation cards
      description: |
        Free-text search plus filters. Multi-value filters are comma separated (`area=technological,educational`).
        Counts and facets for the same filters come from `/api/v1/facets`.
        Default sort is `relevance` when `q` is set, otherwise `recent`.
      parameters:
        - { name: q, in: query, description: Free text. Matches Polish and English text., schema: { type: string, maxLength: 200 } }
        - { name: area, in: query, style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/Area' } } }
        - { name: implementationLevel, in: query, style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/ImplementationLevel' } } }
        - { name: trlMin, in: query, schema: { type: integer, minimum: 1, maximum: 9 } }
        - { name: trlMax, in: query, schema: { type: integer, minimum: 1, maximum: 9 } }
        - { name: tag, in: query, style: form, explode: false, description: Tag slugs., schema: { type: array, items: { type: string } } }
        - { name: region, in: query, description: 'Region code, for example `PK` for Podkarpackie.', schema: { type: string, maxLength: 10 } }
        - { name: audience, in: query, description: Applies the preset from `/api/v1/audiences`. Explicit filters override it., schema: { $ref: '#/components/schemas/AudienceId' } }
        - { name: polishIp, in: query, description: Only cards based on Polish IP., schema: { type: boolean } }
        - { name: minCredibility, in: query, schema: { type: integer, minimum: 0, maximum: 100 } }
        - { name: includeStale, in: query, schema: { type: boolean, default: true } }
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, recent, innovativeness, applicationPotential, credibility]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: A page of card summaries.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CardSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/cards/{cardId}:
    get:
      tags: [Cards]
      operationId: getCard
      summary: Read one full innovation card
      description: Includes the assessment, the sources and the evidence rows the scores were computed from.
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: The card.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Card' }
              examples:
                default:
                  summary: Full card (fictional)
                  value:
                    data:
                      $ref: '#/components/examples/CardDetail/value'
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/cards/{cardId}/similar:
    get:
      tags: [Cards]
      operationId: getSimilarCards
      summary: Cards similar to this one
      description: Used for the innovativeness check and the "similar solutions" panel. Sorted by similarity, highest first.
      parameters:
        - $ref: '#/components/parameters/CardId'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Similar cards.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [card, similarity, basis]
                      properties:
                        card: { $ref: '#/components/schemas/CardSummary' }
                        similarity:
                          type: number
                          minimum: 0
                          maximum: 1
                          description: Computed from stored embeddings and shared keywords. Not written by the model.
                        basis: { $ref: '#/components/schemas/Basis' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/cards/{cardId}/history:
    get:
      tags: [Cards]
      operationId: getCardHistory
      summary: Status changes found by scheduled refreshes
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Changes, newest first. Empty when nothing changed since first seen.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/StatusChange' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/compare:
    get:
      tags: [Cards]
      operationId: compareCards
      summary: Compare two to four cards side by side
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          description: Two to four card ids, comma separated.
          schema:
            type: array
            minItems: 2
            maxItems: 4
            items: { type: string, format: uuid }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: The cards and a row-by-row comparison the frontend can render as a table.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [cards, rows]
                    properties:
                      cards:
                        type: array
                        items: { $ref: '#/components/schemas/CardSummary' }
                      rows:
                        type: array
                        items: { $ref: '#/components/schemas/CompareRow' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/facets:
    get:
      tags: [Reference]
      operationId: getFacets
      summary: Filter options with counts for the current filters
      description: Accepts the same filter parameters as `/api/v1/cards` (not `sort`, `limit`, `offset`). The `tag` and `region` lists return at most the 50 largest options.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: area, in: query, style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/Area' } } }
        - { name: implementationLevel, in: query, style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/ImplementationLevel' } } }
        - { name: tag, in: query, style: form, explode: false, schema: { type: array, items: { type: string } } }
        - { name: region, in: query, schema: { type: string, maxLength: 10 } }
        - { name: audience, in: query, schema: { $ref: '#/components/schemas/AudienceId' } }
        - { name: polishIp, in: query, schema: { type: boolean } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Counts per option.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [area, implementationLevel, tag, region, polishIp]
                    properties:
                      area: { type: array, items: { $ref: '#/components/schemas/FacetOption' } }
                      implementationLevel: { type: array, items: { $ref: '#/components/schemas/FacetOption' } }
                      tag: { type: array, items: { $ref: '#/components/schemas/FacetOption' } }
                      region: { type: array, items: { $ref: '#/components/schemas/FacetOption' } }
                      polishIp:
                        type: object
                        required: ['true', 'false']
                        properties:
                          'true': { type: integer, minimum: 0 }
                          'false': { type: integer, minimum: 0 }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/audiences:
    get:
      tags: [Reference]
      operationId: listAudiences
      security: []
      summary: The six audience presets
      description: A preset is a saved filter set plus the fields to show first. It is not a separate site and not an account type.
      responses:
        '200':
          description: All presets.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Audience' }

  /api/v1/sources:
    get:
      tags: [Reference]
      operationId: listSources
      summary: Sources the Radar collects from, with freshness
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/SourceType' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: A page of sources.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SourceSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  /api/v1/stats/overview:
    get:
      tags: [Statistics]
      operationId: getOverviewStats
      summary: Database size, coverage and freshness
      description: Feeds the home page and the effectiveness measures (task section 6e).
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Current numbers. Computed from the database, never from the model.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/OverviewStats' }

  /api/v1/stats/usage:
    get:
      tags: [Statistics]
      operationId: getUsageStats
      summary: Anonymous usage trends for PCI
      description: Aggregates of events from `POST /api/v1/events`, by role, area and tag. Counts below 5 are not shown, to avoid singling anyone out.
      parameters:
        - { name: from, in: query, description: Start of period., schema: { type: string, format: date } }
        - { name: to, in: query, description: End of period (inclusive)., schema: { type: string, format: date } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Aggregated counts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/UsageStats' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/events:
    post:
      tags: [Events]
      operationId: recordEvent
      summary: Record one anonymous usage event
      description: |
        Safe to retry. The same `eventId` is stored once. No free text and no IP address is stored.
        The server adds the user's role from the session. The user id is not stored with the event.
        The frontend should send events with `navigator.sendBeacon` or a fire-and-forget call, and ignore failures.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsageEvent' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '202':
          description: Accepted. A repeated `eventId` also returns 202.
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/admin/collect-runs:
    post:
      tags: [Admin]
      operationId: startCollectRun
      summary: Start a collection or refresh run
      description: |
        Starts the collectors now, outside the schedule. Used in the demo to show a status change.
        Send an `Idempotency-Key` header. A retry with the same key and body returns the same run.
        The same key with a different body returns `409`.
      security: [{ adminBearer: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 80 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [collect, refresh]
                  description: '`collect` looks for new items. `refresh` rechecks known cards for status changes.'
                sourceIds:
                  type: array
                  description: Limit the run to these sources. Empty or missing means all.
                  items: { type: string, format: uuid }
      responses:
        '202':
          description: Run accepted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CollectRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [Admin]
      operationId: listCollectRuns
      summary: List recent runs
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of runs, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CollectRun' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/collect-runs/{runId}:
    get:
      tags: [Admin]
      operationId: getCollectRun
      summary: Read one run
      security: [{ adminBearer: [] }]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CollectRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      description: Session token from `/api/v1/auth/login` or `/api/v1/auth/register`. Opaque string. Expires (see `Session.expiresAt`).
    adminBearer:
      type: http
      scheme: bearer
      description: Static admin token from the `ADMIN_TOKEN` environment variable. Only for the demo and PCI staff. Never put it in frontend code that is served to the public.

  examples:
    CardDetail:
      summary: Full card (fictional)
      value:
          id: 7b1d5a52-3d0e-4c52-9a43-0a8e5f1c2d01
          title: { pl: '[MOCK] Lekka obudowa czujnika', en: '[MOCK] Lightweight sensor housing' }
          summaryShort: { en: '[MOCK] A composite housing for flight sensors, tested in a university lab.' }
          summary: { en: '[MOCK] A composite housing that cuts sensor mass for small aircraft. Prototype tested in a university lab. Patent application filed in Poland. Fictional example for frontend work.' }
          area: technological
          tags: [{ slug: robotics, label: { pl: Robotyka, en: Robotics } }, { slug: aviation, label: { pl: Lotnictwo, en: Aviation } }]
          organisation: { name: '[MOCK] Example University of Technology', type: university, url: null, region: PK }
          implementationLevel: { value: prototype, basis: confirmed }
          trl: { applicable: true, value: 5, basis: estimate }
          scores: { innovativeness: 62, applicationPotential: 48, credibility: 71 }
          polishIp: true
          lastCheckedAt: '2026-11-22T06:10:00Z'
          stale: false
          sourceCount: 2
          relevance: null
          implementationLevelDetail:
            value: prototype
            basis: confirmed
            sourceIds: [11111111-1111-4111-8111-111111111111]
            evidenceIds: []
            method: null
          trlDetail:
            applicable: true
            value: 5
            basis: estimate
            sourceIds: [11111111-1111-4111-8111-111111111111]
            evidenceIds: []
            method: 'Mapped from "prototype tested in a laboratory environment" to TRL 5 by rule.'
          assessment:
            innovativeness:
              value: 62
              confidence: medium
              insufficientData: false
              sampleSize: 14
              basis: estimate
              sourceIds: [22222222-2222-4222-8222-222222222222]
              evidenceIds: [33333333-3333-4333-8333-333333333333]
              method: 'Distance to the 14 nearest records, plus counts of similar patents and papers.'
              explanation: { en: '[MOCK] Fewer similar patents than the typical record in this area (evidence 3333).' }
            applicationPotential:
              value: 48
              confidence: low
              insufficientData: false
