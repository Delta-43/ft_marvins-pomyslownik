name: release
# Publishes the two container images to GitHub Container Registry and creates a GitHub release.
# Trigger: push a tag like v1.0.0 (or run it by hand from the Actions tab).
#   ghcr.io/delta-43/pomyslownik-api   (API, worker and migrations: the command decides)
#   ghcr.io/delta-43/pomyslownik-web   (Next.js frontend, built against https://demo.delta43.net)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (for example v1.0.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  OWNER: delta-43
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  API_URL: https://demo.delta43.net

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/pomyslownik-api:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/pomyslownik-api:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=EUPL-1.2
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          build-contexts: contract=./docs/api
          build-args: NEXT_PUBLIC_API_BASE_URL=${{ env.API_URL }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/pomyslownik-web:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/pomyslownik-web:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=EUPL-1.2
      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" --title "Pomysłownik! $TAG" --generate-notes \
            --notes "Images: \`ghcr.io/${OWNER}/pomyslownik-api:${TAG}\` and \`ghcr.io/${OWNER}/pomyslownik-web:${TAG}\`. Live: https://pomyslownik.delta43.net"
